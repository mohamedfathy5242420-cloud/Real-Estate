name: brokerhub-local

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Development
  DOTNET_ENVIRONMENT: Development
  ConnectionStrings__BrokerHubDatabase: "Server=sql,1433;Database=BrokerHubDocker;User Id=sa;Password=${SQL_PASSWORD:?Run scripts/Start-FullStack.ps1 first};Encrypt=True;TrustServerCertificate=True"
  ApiSecurity__FrontendOrigins__0: "http://localhost:${WEB_PORT:-8080}"
  ApiSecurity__FrontendOrigins__1: "http://127.0.0.1:${WEB_PORT:-8080}"
  IdentityLinks__FrontendBaseUrl: "http://localhost:${WEB_PORT:-8080}/auth"
  UnitImageStorage__RootPath: /data/images
  DataProtection__KeysPath: /data/keys
  DevelopmentIdentityCapture__Enabled: "true"
  DevelopmentIdentityCapture__RootPath: /data/identity
  DevelopmentIdentityCapture__AllowedRecipients__0: "${ADMIN_EMAIL:-admin@brokerhub.test}"
  DevelopmentIdentityCapture__AllowedRecipients__1: customer@brokerhub.test
  DevelopmentIdentityCapture__AllowedRecipients__2: smoke@brokerhub.test
  DevelopmentIdentityCapture__AllowedRecipients__3: browser@brokerhub.test
  DevelopmentIdentityCapture__AllowedRecipients__4: employee@brokerhub.test
  DevelopmentIdentityCapture__AllowedRecipients__5: manager@brokerhub.test
  DevelopmentIdentityCapture__AllowedRecipients__6: staff-admin@brokerhub.test
  DevelopmentIdentityCapture__AllowedRecipients__7: employee-two@brokerhub.test
  DevelopmentIdentityCapture__AllowedRecipients__8: crm-customer@brokerhub.test
  DevelopmentIdentityCapture__MaximumRecords: "10000"
  RabbitMq__Enabled: "true"
  RabbitMq__HostName: rabbitmq
  RabbitMq__Port: "5671"
  RabbitMq__VirtualHost: /brokerhub
  RabbitMq__UserName: brokerhub
  RabbitMq__Password: "${RABBIT_PASSWORD:?Run scripts/Initialize-LocalMessaging.ps1 first}"
  RabbitMq__UseTls: "true"
  RabbitMq__NamePrefix: brokerhub
  OutboxDispatch__Enabled: "true"
  NotificationConsumer__Enabled: "true"
  Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning

services:
  rabbitmq:
    image: rabbitmq:4.3
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: brokerhub
      RABBITMQ_DEFAULT_PASS: "${RABBIT_PASSWORD:?Run scripts/Initialize-LocalMessaging.ps1 first}"
      RABBITMQ_DEFAULT_VHOST: /brokerhub
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./docker/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./.artifacts/messaging/tls:/etc/rabbitmq/tls:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 25s
    restart: unless-stopped
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:?Run scripts/Start-FullStack.ps1 first}"
      MSSQL_MEMORY_LIMIT_MB: "1536"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  migrate:
    image: ${COMPOSE_PROJECT_NAME:-brokerhub-local}-api:local
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["migrate"]
    environment: *api-environment
    volumes:
      - unit-images:/data/images
      - data-protection:/data/keys
      - identity-capture:/data/identity
    depends_on:
      sql:
        condition: service_healthy
    restart: "no"

  api:
    image: ${COMPOSE_PROJECT_NAME:-brokerhub-local}-api:local
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      <<: *api-environment
      IdentityBootstrap__Enabled: "${BOOTSTRAP_ADMIN:-true}"
      IdentityBootstrap__Email: "${ADMIN_EMAIL:-admin@brokerhub.test}"
      IdentityBootstrap__Password: "${ADMIN_PASSWORD:?Run scripts/Start-FullStack.ps1 first}"
    volumes:
      - unit-images:/data/images
      - data-protection:/data/keys
      - identity-capture:/data/identity
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      API_INTERNAL_ORIGIN: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/auth/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 12
    restart: unless-stopped

  gateway:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/gateway-health"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  smoke:
    image: node:24-bookworm-slim
    profiles: ["tools"]
    working_dir: /checks
    environment:
      BASE_URL: http://gateway
      PUBLIC_ORIGIN: "http://localhost:${WEB_PORT:-8080}"
      SMOKE_PASSWORD: "${SMOKE_PASSWORD:?Run scripts/Start-FullStack.ps1 first}"
      SMOKE_EMAIL: "${SMOKE_EMAIL:-smoke@brokerhub.test}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@brokerhub.test}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Run scripts/Start-FullStack.ps1 first}"
    volumes:
      - ./docker/smoke.mjs:/checks/smoke.mjs:ro
      - identity-capture:/capture:ro
    entrypoint: ["node", "smoke.mjs"]
    depends_on:
      gateway:
        condition: service_healthy

  messaging-probe:
    image: brokerhub-messaging-probe:local
    build:
      context: .
      dockerfile: integration/messaging-probe/Dockerfile
    profiles: ["tools"]
    environment: *api-environment
    volumes:
      - ./.artifacts/messaging/capture:/capture

volumes:
  rabbitmq-data:
  sql-data:
  unit-images:
  data-protection:
  identity-capture:
