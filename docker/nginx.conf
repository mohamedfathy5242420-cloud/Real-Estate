log_format brokerhub_safe '$request_method $uri $status';

server {
    listen 80;
    server_name localhost;
    # Confirmation/reset tokens in query strings must never enter access logs.
    access_log /var/log/nginx/access.log brokerhub_safe;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_origin http://api:8080;
    set $ssr_origin http://frontend:4000;
    client_max_body_size 6m;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /gateway-health { access_log off; return 200 "Healthy"; }
    location /api/ {
        proxy_pass $api_origin$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto "";
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
    }
    location ~ ^/(healthz|readyz|swagger)(/|$) {
        proxy_pass $api_origin$request_uri;
        proxy_set_header Host $http_host;
    }
    location / {
        proxy_pass $ssr_origin$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto "";
        proxy_hide_header X-Powered-By;
    }
}
